# ============================================
# Professional tmux Configuration
# ============================================

# --- 基础设置 ---

# 前缀键改为 Ctrl+a（更顺手）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 真彩色支持
set -g default-terminal "tmux-256color"
set -s terminal-overrides ",xterm-256color:RGB"

# 减少 escape 延迟（对 vim/neovim 用户至关重要）
set -sg escape-time 0

# 增大历史缓冲区
set -g history-limit 50000

# 窗口和面板编号从 1 开始
set -g base-index 1
setw -g pane-base-index 1

# 关闭窗口后自动重新编号
set -g renumber-windows on

# 启用鼠标支持（滚动、选择面板、调整大小）
set -g mouse on

# 使用 vi 模式
setw -g mode-keys vi

# 聚焦事件传递（neovim 需要）
set -g focus-events on

# 单 pane 窗口时窗口名跟随 pane title，多 pane 时回落到当前命令
setw -g automatic-rename on
# 侧边栏 pane 不计入（窗口有侧边栏时以 2 个 pane 视为单 pane）
setw -g automatic-rename-format '#{?#{==:#{window_panes},#{?@sidebar_pane,2,1}},#{pane_title},#{pane_current_command}}'

# --- 快捷键 ---

# 重新加载配置
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display-message "Config reloaded!"

# 更直观的分屏快捷键
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 新窗口保留当前路径；大写 C / N 打开命名弹窗
bind c new-window -c "#{pane_current_path}"
bind C display-popup -E -w 64 -h 14 -x C -y C -T " New window " -d "#{pane_current_path}" '$XDG_CONFIG_HOME/tmux/new-window-prompt.sh window'
bind N display-popup -E -w 64 -h 14 -x C -y C -T " New session " -d "#{pane_current_path}" '$XDG_CONFIG_HOME/tmux/new-window-prompt.sh session'

# 在当前路径打开一个居中的浮动窗格 (tmux 3.8+，旧版本跳过)
# 可用 C-a g 移动/缩放：g 1-4 / g 方向键 贴角贴边，加 Alt 同时缩放，g 0 填满
# 鼠标：Alt+拖动 移动，拖边框 缩放；exit 关闭
%if "#{||:#{m:[12].*,#{version}},#{m:3.[0-7]*,#{version}}}"
%else
bind f new-pane -T " float " -x 80% -y 80% -X 10% -Y 10% -c "#{pane_current_path}"
%endif

# vim 风格面板切换
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + 方向键切换面板（无需前缀）
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift + ↑/↓ 切换上/下一个窗口（无需前缀）
bind -n S-Up previous-window
bind -n S-Down next-window

# Cmd + ←/↑/↓/→（kitty 转成 M-F1~M-F4）：session 列表 / 上一个 / 下一个 session / 所有 session 和 window
bind -n M-F1 choose-tree -Zs
bind -n M-F2 switch-client -p
bind -n M-F3 switch-client -n
bind -n M-F4 choose-tree -Zw

# 面板大小调整（前缀 + HJKL）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 复制模式改进（vi 风格）
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# 快速切换上一个窗口
bind Space last-window

# 同步面板输入（广播模式）
bind S setw synchronize-panes \; display-message "Synchronize #{?synchronize-panes,ON,OFF}"

# --- 侧边栏 ---

# 左侧竖向侧边栏，开启时替代底部状态栏（prefix + b 切换，prefix + B 指定宽度）
bind b run-shell "$XDG_CONFIG_HOME/tmux/sidebar.sh"
bind B command-prompt -p "Sidebar width:" "run-shell '$XDG_CONFIG_HOME/tmux/sidebar.sh %%'"

# 侧边栏开启时：新窗口/新会话/切换窗口或会话后自动补上侧边栏，并立即重绘
set-hook -g 'after-new-window[90]' 'run-shell "$XDG_CONFIG_HOME/tmux/sidebar.sh hook #{window_id}"'
set-hook -g 'after-new-session[90]' 'run-shell "$XDG_CONFIG_HOME/tmux/sidebar.sh hook #{window_id}"'
set-hook -g 'session-window-changed[90]' 'run-shell "$XDG_CONFIG_HOME/tmux/sidebar.sh hook #{window_id}"'
set-hook -g 'client-session-changed[90]' 'run-shell "$XDG_CONFIG_HOME/tmux/sidebar.sh hook #{window_id}"'

# 窗口/会话改名、增删、有提醒时唤醒所有侧边栏重绘
set-hook -g 'window-renamed[90]' 'run-shell -b "$XDG_CONFIG_HOME/tmux/sidebar.sh refresh"'
set-hook -g 'window-unlinked[90]' 'run-shell -b "$XDG_CONFIG_HOME/tmux/sidebar.sh refresh"'
set-hook -g 'window-linked[90]' 'run-shell -b "$XDG_CONFIG_HOME/tmux/sidebar.sh refresh"'
set-hook -g 'session-renamed[90]' 'run-shell -b "$XDG_CONFIG_HOME/tmux/sidebar.sh refresh"'
set-hook -g 'session-closed[90]' 'run-shell -b "$XDG_CONFIG_HOME/tmux/sidebar.sh refresh"'
set-hook -g 'alert-bell[90]' 'run-shell -b "$XDG_CONFIG_HOME/tmux/sidebar.sh refresh"'
set-hook -g 'alert-activity[90]' 'run-shell -b "$XDG_CONFIG_HOME/tmux/sidebar.sh refresh"'

# 侧边栏宽度固定：窗口缩放、布局变化（关 pane、分屏等）后拉回 @sidebar_width
# 两个尺寸不同的客户端之间切换时，tmux 先把窗口等比缩放（侧边栏跟着变宽/变窄），下面的脚本再拉回来，
# 中间隔了一次进程启动，肉眼能看到"压一下又弹回"。所以窗口尺寸变化这条先用纯 tmux 命令同步修正：
# run-shell -C 不起 shell，格式串展开后直接当 tmux 命令执行，在同一轮事件循环里完成，画面刷新前就已修好。
# （if -F 里嵌套命令的 #{…} 不会被展开，必须经 run-shell -C 这一层。）放大中 / 拖边框时跳过。
set-hook -g 'window-resized[89]' {
  if -F '#{&&:#{&&:#{@sidebar_pane},#{!=:#{window_zoomed_flag},1}},#{!=:#{@sidebar_dragging},1}}' {
    run-shell -C 'resize-pane -t "#{@sidebar_pane}" -x "#{@sidebar_width}"'
  }
}
set-hook -g 'window-layout-changed[90]' 'run-shell -b "$XDG_CONFIG_HOME/tmux/sidebar.sh fix-width #{window_id}"'
set-hook -g 'window-resized[90]' 'run-shell -b "$XDG_CONFIG_HOME/tmux/sidebar.sh fix-width #{window_id}"'
set-hook -g 'client-resized[90]' 'run-shell -b "$XDG_CONFIG_HOME/tmux/sidebar.sh fix-width"'

# 鼠标拖边框调整侧边栏宽度：拖动期间暂停上面的宽度修正，松手后新宽度应用到所有窗口
bind -n MouseDrag1Border if -F '#{@sidebar_dragging}' 'resize-pane -M' {
  set -g @sidebar_dragging 1
  resize-pane -M
}
bind -n MouseDragEnd1Border {
  set -gu @sidebar_dragging
  run-shell -b "$XDG_CONFIG_HOME/tmux/sidebar.sh adopt-width #{window_id}"
}

# --- 鼠标：pane ---

# 左键点侧边栏：点 session / 窗口切换过去，点 session / 主机行的图标折叠，点“+ new window”新建；点普通 pane 保持默认行为
bind -n MouseDown1Pane if -F '#{@is_sidebar}' {
  run-shell -b "$XDG_CONFIG_HOME/tmux/sidebar.sh click #{mouse_x} #{mouse_y} '#{client_name}'"
} {
  select-pane -t =
  send-keys -M
}

# 右键菜单：侧边栏里由 sidebar.sh 按点到的行（session / 窗口 / 空白）弹出各自的菜单；其他 pane 弹出 Pane 菜单
bind -n MouseDown3Pane if -F '#{@is_sidebar}' {
  run-shell -b "$XDG_CONFIG_HOME/tmux/sidebar.sh menu #{mouse_x} #{mouse_y} #{pane_left} #{pane_top} '#{client_name}'"
} {
  display-menu -T "#[bold] Pane " -x M -y M \
    "─ Split"                                "" "" \
    "  ↔ Horizontal"                         h "split-window -h -c '#{pane_current_path}'" \
    "  ↕ Vertical"                           v "split-window -v -c '#{pane_current_path}'" \
    "" \
    "─ Toggle"                               "" "" \
    "#{?synchronize-panes,  ● Sync Panes,  ○ Sync Panes}" S "setw synchronize-panes" \
    "#{?window_zoomed_flag,  ● Zoom,  ○ Zoom}"             z "resize-pane -Z" \
    "" \
    "─ Move"                                 "" "" \
    "  ↑ Swap Up"                            u "swap-pane -U" \
    "  ↓ Swap Down"                          d "swap-pane -D" \
    "  ⎋ Break to Window"                    b "break-pane" \
    "  ⎘ Join from..."                       j "choose-window 'join-pane -s %%'" \
    "  → Send to..."                         s "choose-window 'join-pane -t %%'" \
    "" \
    "─ Layout"                               "" "" \
    "  ▦ Tiled"                              t "select-layout tiled" \
    "  ⬌ Even Horizontal"                    H "select-layout even-horizontal" \
    "  ⬍ Even Vertical"                      V "select-layout even-vertical" \
    "" \
    "─ Sidebar"                              "" "" \
    "#{?@sidebar_pane,  ● Sidebar,  ○ Sidebar}" b "run-shell '$XDG_CONFIG_HOME/tmux/sidebar.sh'" \
    "" \
    "─ Tools"                                "" "" \
    "  # Pane Numbers"                       q "display-panes" \
    "  ⌨ Key Bindings"                       k "list-keys" \
    "  ⏲ Clock"                              T "clock-mode" \
    "" \
    "─ Clipboard"                            "" "" \
    "  ≡ Choose Buffer"                      p "choose-buffer" \
    "" \
    "  ✕ Kill Pane"                          x "confirm-before -p 'Kill pane? (y/n)' kill-pane"
}

# --- 状态栏 ---

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 50
set -g display-time 2000
setw -g window-status-separator " "

# 鼠标点击状态栏左侧 session 名称 → 显示 session 列表
bind -n MouseDown1StatusLeft choose-tree -s

# 右键点击状态栏左侧 session 名称 → Session 菜单
bind -n MouseDown3StatusLeft display-menu -T "#[bold] Session " -x M -y S \
  "  + New Session"                        c "display-popup -E -w 64 -h 14 -x C -y C -T ' New session ' -d '#{pane_current_path}' '$XDG_CONFIG_HOME/tmux/new-window-prompt.sh session'" \
  "  ⇄ Switch Session"                     s "choose-tree -s" \
  "  ← Previous Session"                   p "switch-client -p" \
  "  → Next Session"                       n "switch-client -n" \
  "  ✎ Rename Session"                     R "command-prompt -p 'Rename:' 'rename-session %%'" \
  "" \
  "  ⏏ Detach"                             d "detach-client"

# 左键点击窗口列表末尾的 + 按钮（由 apply-theme.sh 的 status-format 插入）→ 弹出浮层输入名字新建窗口；点其他窗口 tab 保持切换
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},newwin}" \
  "display-popup -E -w 64 -h 14 -x C -y C -T ' New window ' -d '#{pane_current_path}' '$XDG_CONFIG_HOME/tmux/new-window-prompt.sh window'" \
  "switch-client -t ="

# 右键点击状态栏窗口列表 → Window 菜单
bind -n MouseDown3Status display-menu -T "#[bold] Window " -x M -y S \
  "  + New Window"                         n "new-window -c '#{pane_current_path}'" \
  "  ✎ Rename Window"                      r "command-prompt -p 'Rename:' 'rename-window %%'" \
  "  ✕ Kill Window"                        x "confirm-before -p 'Kill window? (y/n)' kill-window"

# --- 主题：自动检测 macOS Light/Dark ---

# 启动时自动检测并应用主题
run-shell "$XDG_CONFIG_HOME/tmux/apply-theme.sh"

# attach 时仅刷新主题，避免每次创建 session 重复加载整份配置
set-hook -g client-attached 'run-shell "$XDG_CONFIG_HOME/tmux/apply-theme.sh"'

# 手动切换主题快捷键
bind T run-shell "$XDG_CONFIG_HOME/tmux/apply-theme.sh" \; display-message "Theme refreshed!"

# --- 其他 ---

# 不监控活动：侧边栏在后台窗口也要重绘以保持最新，开着会让每个窗口一直被标记为有活动。
# （而且 visual-activity off 时提醒方式是向终端发 BEL，kitty 会整屏闪一下）
setw -g monitor-activity off
set -g visual-activity off
set -g activity-action none

# 后台窗口有活动时，加 bell 通知（终端会闪烁/发声）
set -g monitor-bell on
set -g visual-bell on
set -g bell-action other

# 把子进程从 tmux server 的 namespace 重新接入到当前用户的 Aqua session
if-shell "command -v reattach-to-user-namespace" "set-option -g default-command 'reattach-to-user-namespace -l ${SHELL}'"

# 扩展键序列支持（Claude Code 的 Shift+Enter 换行需要）
set -s extended-keys on
set -s terminal-features 'xterm*:RGB:extkeys,*:hyperlinks'
